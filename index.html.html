<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AU 위젯 스튜디오</title>
<style>
  :root {
    --bg: #f3f4f7; --panel: #fff; --ink: #1f2430; --sub: #6b7280; --line: #e0e3ea;
    --accent: #3f55b8; --accent-soft: #e8ecfb; --danger: #b93a2e; --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--ink); background: var(--bg);
    font: 14px/1.55 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', system-ui, sans-serif;
  }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* ---------- 상단 바 ---------- */
  .top {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .top h1 { margin: 0 auto 0 0; font-size: 16px; font-weight: 700; }
  .saved { font-size: 12px; color: var(--sub); margin-right: 4px; }
  .btn {
    padding: 6px 12px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; cursor: pointer; line-height: 1.4;
  }
  .btn:hover { background: #f6f7fa; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .btn.primary:hover { background: #34479d; }
  .btn.danger { color: var(--danger); }
  .btn.mini { padding: 2px 8px; font-size: 12px; border-radius: 6px; }
  .btn[disabled] { opacity: .4; cursor: default; }

  /* ---------- 본문 2단 ---------- */
  .main { display: grid; grid-template-columns: minmax(360px, 470px) minmax(0, 1fr); height: calc(100vh - 55px); }
  .editor { overflow: auto; padding: 14px 16px 90px; background: var(--panel); border-right: 1px solid var(--line); }
  .preview { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  .guide { margin-bottom: 12px; padding: 10px 12px; background: var(--accent-soft); border-radius: var(--radius); font-size: 13px; }
  .guide ol { margin: 4px 0 0; padding-left: 18px; }
  .guide b { font-weight: 700; }

  details.sec { margin: 0 0 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
  details.sec > summary { padding: 9px 12px; font-weight: 700; cursor: pointer; list-style: none; user-select: none; }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary::before { content: '▸'; display: inline-block; width: 1.1em; color: var(--sub); }
  details.sec[open] > summary::before { content: '▾'; }
  details.sec > .body { padding: 2px 12px 12px; }

  .f { margin-top: 10px; }
  .fl { display: block; margin-bottom: 3px; font-size: 12px; font-weight: 700; color: #444b5a; }
  .ctl { display: flex; align-items: center; gap: 8px; }
  .ctl > input[type=text], .ctl > input[type=number], .ctl > select, .ctl > textarea { flex: 1; min-width: 0; }
  input[type=text], input[type=number], select, textarea {
    width: 100%; padding: 6px 9px; background: #fff; border: 1px solid #cfd4de; border-radius: 7px;
  }
  textarea { resize: vertical; line-height: 1.55; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
  .hint { display: block; margin-top: 3px; font-size: 12px; color: var(--sub); line-height: 1.45; }
  .chk { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .chk input { width: 16px; height: 16px; margin: 0; }
  .thumb { flex: none; width: 34px; height: 34px; border-radius: 6px; overflow: hidden; border: 1px dashed #cfd4de; background: #f3f4f7; }
  .thumb img { display: none; width: 100%; height: 100%; object-fit: cover; }
  .thumb.on { border-style: solid; }
  .thumb.on img { display: block; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* 카드 탭 */
  .cardbar { margin: 4px 0 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: #fafbfd; }
  .cardbar .lbl { font-size: 12px; font-weight: 700; color: #444b5a; margin-bottom: 6px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .tab {
    max-width: 150px; padding: 4px 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    background: #fff; border: 1px solid var(--line); border-radius: 999px; cursor: pointer;
  }
  .tab:hover { background: #f1f3f8; }
  .tab.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
  .tab.add { color: var(--accent); border-style: dashed; }
  .cardops { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

  /* 타임라인/추가 인물 항목 */
  .item { margin-top: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: #fafbfd; }
  .item-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .item-top .grow { flex: 1; min-width: 70px; }
  .item-top select { width: auto; }
  .item-top .spoil { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; font-size: 12px; }
  .item-top .spoil input { margin: 0; }
  .item .f:first-child { margin-top: 0; }
  .item .in-title { margin-top: 8px; }
  .item textarea { margin-top: 6px; }
  .item-head { display: flex; align-items: center; justify-content: space-between; font-weight: 700; margin-bottom: 4px; }
  .addrow { margin-top: 10px; }

  /* ---------- 미리보기 ---------- */
  .pv-bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .seg { display: inline-flex; align-items: center; gap: 6px; }
  .seg .sl { font-size: 12px; color: var(--sub); }
  .seg .grp { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg .grp button { padding: 4px 10px; background: #fff; border: 0; border-left: 1px solid var(--line); cursor: pointer; font-size: 13px; }
  .seg .grp button:first-child { border-left: 0; }
  .seg .grp button.on { background: var(--accent); color: #fff; font-weight: 700; }
  .pv-note { padding: 6px 14px; font-size: 12px; color: var(--sub); background: #fafbfd; border-bottom: 1px solid var(--line); }
  .pv-stage { flex: 1; min-height: 0; overflow: auto; padding: 16px; display: flex; justify-content: center; }
  .pv-stage iframe { width: 800px; max-width: 100%; height: 100%; min-height: 420px; background: #fff; border: 1px solid var(--line); border-radius: 8px; }

  /* ---------- 모달 / 토스트 ---------- */
  .modal { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(20, 24, 36, .5); }
  .modal[hidden], .toast[hidden] { display: none; }
  .modal-card { width: min(820px, 100%); max-height: 90vh; display: flex; flex-direction: column; gap: 10px; padding: 16px; background: var(--panel); border-radius: 12px; }
  .modal-card h2 { margin: 0; font-size: 16px; }
  .modal-card p { margin: 0; color: var(--sub); font-size: 13px; }
  .modal-card textarea { flex: 1; min-height: 300px; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; resize: none; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
  .modal-actions .err { margin-right: auto; color: var(--danger); font-size: 13px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 30; padding: 10px 16px; background: #1f2430; color: #fff; border-radius: 10px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }

  @media (max-width: 900px) {
    .main { display: block; height: auto; }
    .editor { overflow: visible; border-right: 0; }
    .preview { height: 90vh; border-top: 1px solid var(--line); }
  }
</style>
</head>
<body>

<div class="top">
  <h1>AU 위젯 스튜디오</h1>
  <span class="saved" id="saved"></span>
  <button class="btn" id="btnImport" type="button">기존 코드 불러오기</button>
  <button class="btn" id="btnView" type="button">코드 보기</button>
  <button class="btn danger" id="btnReset" type="button">샘플로 초기화</button>
  <button class="btn primary" id="btnCopy" type="button">코드 복사</button>
</div>

<div class="main">
  <div class="editor" id="editor">
    <div class="guide">
      <b>사용 방법</b>
      <ol>
        <li>아래에서 내용을 입력하면 오른쪽 미리보기에 바로 반영돼요.</li>
        <li>다 되면 위의 <b>코드 복사</b>를 눌러요.</li>
        <li>티스토리 글의 HTML 모드에 붙여넣으면 끝이에요.</li>
        <li>나중에 고칠 땐 티스토리에서 코드를 복사해 <b>기존 코드 불러오기</b>로 불러오면 돼요.</li>
      </ol>
      입력한 내용은 이 브라우저에 자동 저장돼요.
    </div>

    <div id="pageSec"></div>

    <div class="cardbar">
      <div class="lbl">카드 (홈 화면에 나오는 AU 목록)</div>
      <div class="tabs" id="tabs"></div>
      <div class="cardops" id="cardops"></div>
    </div>

    <div id="cardForm"></div>
  </div>

  <div class="preview">
    <div class="pv-bar">
      <div class="seg"><span class="sl">화면 폭</span>
        <span class="grp" data-seg="w"><button type="button" data-val="pc">PC</button><button type="button" data-val="tab">태블릿</button><button type="button" data-val="mob">모바일</button></span>
      </div>
      <div class="seg"><span class="sl">스킨 배경</span>
        <span class="grp" data-seg="dark"><button type="button" data-val="0">밝게</button><button type="button" data-val="1">어둡게</button></span>
      </div>
      <div class="seg"><span class="sl">보기</span>
        <span class="grp" data-seg="mode"><button type="button" data-val="home">홈</button><button type="button" data-val="detail">선택한 카드 상세</button></span>
      </div>
    </div>
    <div class="pv-note">실제로 붙여넣을 코드와 똑같은 코드로 그려요. 글꼴·글자색은 스킨마다 달라지니 밝게/어둡게로 비교해 보세요.</div>
    <div class="pv-stage"><iframe id="frame" title="미리보기"></iframe></div>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-card">
    <h2 id="mTitle"></h2>
    <p id="mDesc"></p>
    <textarea id="mText" spellcheck="false"></textarea>
    <div class="modal-actions">
      <span class="err" id="mErr"></span>
      <button class="btn" id="mCancel" type="button">닫기</button>
      <button class="btn primary" id="mOk" type="button"></button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function () {
  'use strict';

  /* 위젯 코드 원본 (이 틀에 입력한 데이터를 끼워서 코드를 만들어요) */
  var TEMPLATE = "<\u0021-- AU 정리 위젯 · 티스토리 HTML 모드에서 글 중간에 그대로 붙여넣기\n     (AU 위젯 스튜디오에서 만든 코드예요. 내용 수정은 스튜디오에서 하고, 코드를 다시 복사해 붙여넣으면 돼요)\n     - 배경 투명 / 폰트·글자색은 스킨을 따라감\n     - 한 글에 여러 개를 넣어도 서로 간섭하지 않음 (주소(URL)도 바뀌지 않음)\n     - 화면 구성은 스크립트가 만들기 때문에, 에디터가 줄바꿈 등을 끼워 넣어도 레이아웃이 밀리지 않음 -->\n<style>\n  /* =====================================================\n     📐 크기 조절 (스튜디오의 '기본 설정'에서 바꿀 수 있어요. 직접 고칠 땐 여기 세 줄)\n     --au-max        : 위젯 최대 가로폭   (본문 폭에 맞춰 조절)\n     --au-fs         : 전체 글자 크기 배율 (스킨 기본 글자 크기 기준)\n     --au-sticky-top : 상세 페이지 왼쪽 단락이 따라올 때 위쪽 여백\n                       (스킨에 상단 고정 메뉴가 있으면 그 높이만큼 키우세요)\n     ===================================================== */\n  .au-w {\n    --au-max: 740px;\n    --au-fs: .92em;\n    --au-sticky-top: 16px;\n    --au-line: rgba(128,128,128,.45);\n    --au-line2: rgba(128,128,128,.7);\n    --au-soft: rgba(128,128,128,.14);\n\n    display: block; position: relative;\n    width: 100%; max-width: var(--au-max);\n    margin: 1.6em auto; padding: 0;\n    font: inherit; font-size: var(--au-fs);\n    color: inherit; background: transparent;\n    line-height: 1.65; text-align: left; text-indent: 0; letter-spacing: normal;\n    word-break: keep-all; overflow-wrap: anywhere;\n    scroll-margin-top: 16px;\n    container: au-root / inline-size;\n  }\n  .au-w, .au-w * { box-sizing: border-box; }\n  .au-w br { display: none; }\n  .au-w img { margin: 0; padding: 0; float: none; box-shadow: none; max-width: 100%; }\n  .au-w .au-view[hidden] { display: none !important; }\n  .au-w .au-view.au-enter { animation: au-in .36s cubic-bezier(.2,.7,.2,1); }\n  @keyframes au-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }\n\n  /* ================= 홈 ================= */\n  .au-w .au-home-head { margin-bottom: 10px; }\n  .au-w .au-home-title { font-size: 1.3em; font-weight: 700; line-height: 1.35; }\n  .au-w .au-home-desc { margin-top: 2px; opacity: .7; font-size: .9em; }\n\n  .au-w .au-grid {\n    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));\n    gap: 16px; padding: 10px 8px;        /* 확대된 카드가 잘리지 않게 */\n  }\n  /* 카드는 링크(a)가 아니라 div 버튼 → 스킨의 링크 hover 색이 적용되지 않음 */\n  .au-w .au-card {\n    display: block; position: relative; min-width: 0;\n    aspect-ratio: 10 / 9;\n    color: inherit; text-decoration: none;\n    border: 1px solid var(--au-line); border-radius: 14px;\n    overflow: hidden; cursor: pointer;\n    transition: transform .4s cubic-bezier(.2,.7,.2,1), box-shadow .4s ease;\n    -webkit-tap-highlight-color: transparent;\n  }\n  .au-w .au-card:hover, .au-w .au-card:focus, .au-w .au-card:active { color: inherit; }\n  .au-w .au-card-img {\n    position: absolute; left: 0; right: 0; top: 0; height: 100%;\n    overflow: hidden;\n    transition: height .5s cubic-bezier(.2,.7,.2,1);\n  }\n  .au-w .au-card-img::after {\n    content: ''; position: absolute; inset: 0;\n    background: linear-gradient(to top, rgba(0,0,0,.6), rgba(0,0,0,0) 55%);\n  }\n  .au-w .au-card-bg {\n    position: absolute; inset: 0;\n    background-size: cover; background-position: center;\n    transition: transform .6s cubic-bezier(.2,.7,.2,1);\n  }\n  .au-w .au-card-title {\n    position: absolute; left: 12px; right: 12px; bottom: 10px; z-index: 1;\n    color: #fff; font-weight: 700; font-size: 1.05em; line-height: 1.35;\n    text-shadow: 0 1px 6px rgba(0,0,0,.45);\n    max-height: 4.2em; overflow: hidden;\n  }\n  .au-w .au-card-desc {\n    position: absolute; left: 0; right: 0; bottom: 0; height: 48%;\n    padding: 9px 12px;\n    color: inherit;\n    border-top: 1px solid var(--au-line);\n    font-size: .85em; line-height: 1.55;\n    opacity: 0; transform: translateY(12px); overflow: hidden;\n    transition: opacity .35s ease, transform .5s cubic-bezier(.2,.7,.2,1);\n  }\n  .au-w .au-card-desc > div {\n    color: inherit;\n    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;\n    overflow: hidden; white-space: pre-line;\n  }\n  .au-w .au-card:focus-visible { transform: scale(1.05); z-index: 2; box-shadow: 0 14px 30px rgba(0,0,0,.22); outline: 3px solid currentColor; outline-offset: 3px; }\n  .au-w .au-card:focus-visible .au-card-img { height: 52%; }\n  .au-w .au-card:focus-visible .au-card-desc { opacity: 1; transform: none; }\n  .au-w .au-card:focus-visible .au-card-bg { transform: scale(1.08); }\n  @media (hover: hover) {\n    .au-w .au-card:hover { transform: scale(1.05); z-index: 2; box-shadow: 0 14px 30px rgba(0,0,0,.22); }\n    .au-w .au-card:hover .au-card-img { height: 52%; }\n    .au-w .au-card:hover .au-card-desc { opacity: 1; transform: none; }\n    .au-w .au-card:hover .au-card-bg { transform: scale(1.08); }\n  }\n\n  /* ================= 내부 페이지 ================= */\n  .au-w .au-back {\n    display: inline-flex; align-items: center; gap: 6px;\n    margin: 0; padding: .3em .9em .3em .65em;\n    font: inherit; font-size: .88em; color: inherit;\n    background: transparent;\n    border: 1px solid var(--au-line); border-radius: 999px;\n    cursor: pointer; transition: background .2s;\n  }\n  .au-w .au-back:hover { background: var(--au-soft); color: inherit; }\n  .au-w .au-back:focus-visible { outline: 3px solid currentColor; outline-offset: 3px; }\n  .au-w .au-back svg { width: 1em; height: 1em; }\n\n  /* 위쪽 두 단락: 왼쪽(제목·세계관·핵심 이미지) / 오른쪽(캐릭터 프로필) */\n  .au-w .au-top {\n    position: relative;\n    display: grid; grid-template-columns: 36% minmax(0, 1fr); gap: 20px;\n    align-items: start; margin-top: 12px;\n  }\n  .au-w .au-top::before {              /* 두 단락 사이 세로선 (높이 전체) */\n    content: ''; position: absolute; top: 0; bottom: 0; left: calc(36% + 10px);\n    border-left: 1px solid var(--au-line); pointer-events: none;\n  }\n  .au-w .au-left { min-width: 0; display: flex; flex-direction: column; }\n  .au-w .au-left.au-stick { position: sticky; top: var(--au-sticky-top); }   /* 오른쪽을 읽는 동안 따라옴 */\n  .au-w .au-right { min-width: 0; container: au-col / inline-size; }\n  .au-w .au-d-title { font-siz     ], true));

    box.appendChild(section('charA', '캐릭터 A (프로필 왼쪽 / 타임라인 왼쪽)', charFields(base + '.a'), true));
    box.appendChild(section('charB', '캐릭터 B (프로필 오른쪽 / 타임라인 오른쪽)', charFields(base + '.b'), false));

    /* 추가 인물 */
    var moreKids = [h('small', { class: 'hint', text: '프로필에만 더 올리는 인물이에요. 타임라인에는 나오지 않아요.' })];
    card.more.forEach(function (m, mi) {
      var p = base + '.more.' + mi;
      var item = h('div', { class: 'item' }, [
        h('div', { class: 'item-head' }, [
          h('span', { text: '추가 인물 ' + (mi + 1) }),
          h('span', {}, [
            h('button', { type: 'button', class: 'btn mini', text: '↑', onclick: function () { if (moveItem(card.more, mi, -1)) { renderCardForm(); changed(); } } }),
            ' ',
            h('button', { type: 'button', class: 'btn mini', text: '↓', onclick: function () { if (moveItem(card.more, mi, 1)) { renderCardForm(); changed(); } } }),
            ' ',
            h('button', { type: 'button', class: 'btn mini danger', text: '삭제', onclick: function () { card.more.splice(mi, 1); renderCardForm(); changed(); } })
          ])
        ])
      ].concat(charFields(p)));
      moreKids.push(item);
    });
    moreKids.push(h('div', { class: 'addrow' }, [h('button', { type: 'button', class: 'btn', text: '+ 인물 추가', onclick: function () { card.more.push(newChar()); ui.open.more = true; renderCardForm(); changed(); } })]));
    box.appendChild(section('more', '추가 인물 (프로필만)', moreKids, false));

    /* 타임라인 */
    var tlKids = [h('small', { class: 'hint', text: '위에서 아래로 시간순이에요. A는 왼쪽, B는 오른쪽에 번갈아 놓여요. 결말처럼 가리고 싶은 사건은 "스포일러"를 체크하세요.' })];
    card.timeline.forEach(function (ev, ei) {
      var p = base + '.timeline.' + ei;
      var whoSel = ctl(p + '.who', { type: 'select', options: [['A', 'A 쪽'], ['B', 'B 쪽']] });
      var when = ctl(p + '.when', { ph: '시기' }); when.className = 'grow';
      var spoil = h('label', { class: 'spoil', title: '체크하면 타임라인에서 이 사건의 내용이 가려지고, 눌러야 보여요' }, [ctl(p + '.spoiler', { type: 'check' }), h('span', { text: '스포일러' })]);
      var title = ctl(p + '.title', { ph: '사건 제목' }); title.className = 'in-title';
      var text = ctl(p + '.text', { type: 'textarea', rows: 3, ph: '사건 내용' });
      tlKids.push(h('div', { class: 'item' }, [
        h('div', { class: 'item-top' }, [
          h('span', { text: (ei + 1) + '.' }), whoSel, when, spoil,
          h('button', { type: 'button', class: 'btn mini', text: '↑', onclick: function () { if (moveItem(card.timeline, ei, -1)) { renderCardForm(); changed(); } } }),
          h('button', { type: 'button', class: 'btn mini', text: '↓', onclick: function () { if (moveItem(card.timeline, ei, 1)) { renderCardForm(); changed(); } } }),
          h('button', { type: 'button', class: 'btn mini danger', text: '✕', onclick: function () { card.timeline.splice(ei, 1); renderCardForm(); changed(); } })
        ]),
        title, text
      ]));
    });
    tlKids.push(h('div', { class: 'addrow' }, [h('button', {
      type: 'button', class: 'btn', text: '+ 사건 추가',
      onclick: function () {
        var last = card.timeline[card.timeline.length - 1];
        var ev = newEvent(); ev.who = last && last.who === 'A' ? 'B' : 'A';
        card.timeline.push(ev); ui.open.timeline = true; renderCardForm(); changed();
      }
    })]));
    box.appendChild(section('timeline', '타임라인 (' + card.timeline.length + '개)', tlKids, true));
  }

  function renderAll() { renderPage(); renderTabs(); renderCardForm(); }

  /* 입력 → 상태 (이벤트 위임) */
  function onField(e) {
    var t = e.target, p = t.getAttribute && t.getAttribute('data-path');
    if (!p) return;
    var v;
    if (t.type === 'checkbox') v = t.checked;
    else if (t.type === 'number') v = t.value === '' ? '' : parseFloat(t.value);
    else v = t.value;
    setPath(state, p, v);
    if (/^cards\.\d+\.title$/.test(p)) {
      var tab = document.querySelector('.tab[data-i="' + p.split('.')[1] + '"]');
      if (tab) { tab.textContent = (+p.split('.')[1] + 1) + '. ' + (str(v).trim() || '제목 없음'); tab.title = str(v); }
    }
    if (t.getAttribute('data-thumb')) setThumb(t.parentNode.querySelector('img'), str(v).trim());
    changed();
  }
  $('editor').addEventListener('input', onField);
  $('editor').addEventListener('change', onField);

  /* ===================== 상단 버튼 ===================== */
  function copyText(t) {
    function fallback() {
      var ta = h('textarea', { style: 'position:fixed;left:-9999px;top:0' });
      ta.value = t; document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta); return ok;
    }
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(t).then(function () { return true; }, function () { return fallback(); });
    }
    return Promise.resolve(fallback());
  }
  function kb(code) { return Math.max(1, Math.round(new Blob([code]).size / 1024)); }

  $('btnCopy').addEventListener('click', function () {
    var code = generate();
    copyText(code).then(function (ok) {
      toast(ok ? '코드를 복사했어요 (' + kb(code) + 'KB). 티스토리 HTML 모드에 붙여넣으세요.' : '복사하지 못했어요. "코드 보기"에서 직접 복사해 주세요.');
    });
  });

  var modalMode = '';
  function openModal(mode) {
    modalMode = mode;
    var code = mode === 'view' ? generate() : '';
    $('mTitle').textContent = mode === 'view' ? '만들어진 코드 (' + kb(code) + 'KB)' : '기존 코드 불러오기';
    $('mDesc').textContent = mode === 'view'
      ? '전체 선택해서 복사하거나 아래 버튼을 누르세요. 티스토리 HTML 모드에 그대로 붙여넣으면 돼요.'
      : '티스토리 글의 HTML 모드에서 위젯 코드를 복사해 아래에 붙여넣으세요. (현재 편집 중인 내용은 대체돼요)';
    var ta = $('mText');
    ta.value = code; ta.readOnly = mode === 'view';
    $('mOk').textContent = mode === 'view' ? '코드 복사' : '불러오기';
    $('mErr').textContent = '';
    $('modal').hidden = false;
    ta.focus(); if (mode === 'view') ta.select();
  }
  function closeModal() { $('modal').hidden = true; }
  $('btnView').addEventListener('click', function () { openModal('view'); });
  $('btnImport').addEventListener('click', function () { openModal('import'); });
  $('mCancel').addEventListener('click', closeModal);
  $('modal').addEventListener('mousedown', function (e) { if (e.target === $('modal')) closeModal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('modal').hidden) closeModal(); });
  $('mOk').addEventListener('click', function () {
    if (modalMode === 'view') {
      copyText($('mText').value).then(function (ok) { toast(ok ? '코드를 복사했어요.' : '복사하지 못했어요. 직접 선택해서 복사해 주세요.'); });
      return;
    }
    try {
      var s = importCode($('mText').value);
      state = s; ui.sel = 0; closeModal();
      renderAll(); syncSegs(); saveSoon(); renderPreview(false);
      toast('불러왔어요. 카드 ' + state.cards.length + '개');
    } catch (err) {
      $('mErr').textContent = '불러오지 못했어요: ' + err.message;
    }
  });
  $('btnReset').addEventListener('click', function () {
    if (!window.confirm('지금까지 입력한 내용이 모두 사라지고 샘플로 돌아가요. 계속할까요?')) return;
    state = initialState(); ui.sel = 0; renderAll(); saveSoon(); renderPreview(false);
  });

  /* ===================== 시작 ===================== */
  load(); clampSel();
  renderAll(); syncSegs(); renderPreview(false);
  window.addEventListener('beforeunload', function () { try { localStorage.setItem(KEY, JSON.stringify({ state: state, ui: ui })); } catch (e) {} });
})();
</script>
</body>
</html>
